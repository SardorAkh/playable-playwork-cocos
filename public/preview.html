<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>playable preview host</title>
<style>html,body{margin:0;height:100%;background:#fff}</style>
</head>
<body>
<script>
/*
 * Preview host. The tuner posts the composed build here and this page writes it over
 * itself, so the playable ends up with a normal same-origin document URL. That matters:
 * the VFS runtime inside every build derives its base directory from location.href and
 * ignores anything served from blob:, and an srcdoc document would resolve "./index.js"
 * against about:srcdoc. Writing into a real page keeps resolution identical to opening
 * the build as a file.
 */
(function () {
    var CHANNEL = 'playable-preview-host';
    window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.channel !== CHANNEL || data.type !== 'write' || typeof data.html !== 'string') return;
        document.open();
        document.write(data.html);
        document.close();
    });
    parent.postMessage({ channel: CHANNEL, type: 'ready' }, '*');
})();
</script>
</body>
</html>
